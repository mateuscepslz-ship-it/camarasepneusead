# Base44 development environment for the EAD platform.
#
# The project is a static front-end (HTML/CSS/JS) that keeps all of its data in
# the browser's localStorage, so there is no backend, database or external
# service to run. The repo is bind-mounted and served from the cloned source, so
# edits are picked up on refresh without rebuilding anything.
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    command:
      ["python3", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/app"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/index.html', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
